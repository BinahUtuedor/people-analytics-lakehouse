version: "3.9"

services:

  ##########################################################################
  # Linux Spark integration tests - development/test only
  ##########################################################################

  spark-tests:

    build:
      context: .
      dockerfile: docker/spark-tests/Dockerfile

    working_dir: /workspace

    environment:
      PYSPARK_PYTHON: /usr/local/bin/python
      PYSPARK_DRIVER_PYTHON: /usr/local/bin/python
      SPARK_LOCAL_IP: 127.0.0.1

    volumes:
      - .:/workspace

    command:
      - python
      - -m
      - unittest
      - discover
      - -s
      - tests/spark/bronze
      - -p
      - test_*.py
      - -v

  ##########################################################################
  # Linux Spark live Bronze runner - explicit invocation only
  ##########################################################################

  spark-bronze:

    build:
      context: .
      dockerfile: docker/spark-tests/Dockerfile

    working_dir: /workspace

    environment:
      PYTHONPATH: /workspace
      PYSPARK_PYTHON: /usr/local/bin/python
      PYSPARK_DRIVER_PYTHON: /usr/local/bin/python
      SPARK_LOCAL_IP: 127.0.0.1
      SPARK_JARS_PACKAGES: org.apache.hadoop:hadoop-aws:3.5.0
      SPARK_MASTER: local[*]
      AWS_REGION: ${AWS_REGION:-eu-west-2}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_S3_RAW_PREFIX: ${AWS_S3_RAW_PREFIX:-raw/postgresql}
      AWS_S3_BRONZE_PREFIX: ${AWS_S3_BRONZE_PREFIX:-bronze}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}

    volumes:
      - .:/workspace

    entrypoint:
      - python
      - spark/bronze/job.py

    command:
      - --help

  ##########################################################################
  # EMR 7.13 compatibility gate - local/static only
  ##########################################################################

  emr-compat-tests:

    build:
      context: .
      dockerfile: docker/emr-compat/Dockerfile

    working_dir: /workspace

    environment:
      PYTHONPATH: /workspace
      PYSPARK_PYTHON: /usr/local/bin/python
      PYSPARK_DRIVER_PYTHON: /usr/local/bin/python
      SPARK_LOCAL_IP: 127.0.0.1

    volumes:
      - .:/workspace

    command:
      - python
      - -m
      - unittest
      - discover
      - -s
      - tests/spark/bronze
      - -p
      - test_*.py
      - -v

  ##########################################################################
  # PostgreSQL - Operational Database
  ##########################################################################

  postgres:

    image: postgres:17

    container_name: people_analytics_postgres

    restart: always

    environment:
      POSTGRES_DB: people_analytics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      # Host:Container
      # We use 5433 on host to avoid conflict with any local PostgreSQL installation
      - "5433:5432"

    volumes:
      # Persist PostgreSQL data
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - analytics_net

  ##########################################################################
  # pgAdmin 4
  ##########################################################################

  pgadmin:

    image: dpage/pgadmin4:latest

    container_name: people_analytics_pgadmin

    restart: always

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@peopleanalytics.com
      PGADMIN_DEFAULT_PASSWORD: admin

    ports:
      - "5050:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    networks:
      - analytics_net


##########################################################################
# Future Services
##########################################################################

# airflow:
#   image: apache/airflow:2.9.0
#   ...

# spark:
#   image: bitnami/spark:3.5
#   ...

volumes:

  postgres_data:

  pgadmin_data:

networks:

  analytics_net:
    driver: bridge
